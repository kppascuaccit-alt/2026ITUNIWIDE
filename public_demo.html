<!DOCTYPE html>
<html lang="en"> 
<head>
<meta charset="UTF-8">
<title>IT UNIWIDE - Public Winner View</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg,#141E30,#243B55);
    color: #fff;
    margin: 0;
    padding: 30px;
}

h1 {
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    color: #FFD700;
}

.admin-panel {
    background: rgba(50,50,50,0.95);
    padding: 20px;
    border-radius: 12px;
    max-width: 1200px;
    margin: auto;
}

.event-block {
    margin-bottom: 25px;
    border-bottom: 1px solid #666;
    padding-bottom: 15px;
}

.ranking-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.rank-cell {
    width: 90px;
    font-size: 13px;
    background: rgba(255,255,255,0.08);
    padding: 8px;
    border-radius: 6px;
    text-align: center;
}

button {
    padding: 10px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    cursor: not-allowed;
    width: 200px;
    color: white;
    font-weight: bold;
    opacity: 0.6;
}

.leaderboard-container {
    margin-top: 20px;
    background: rgba(255,255,255,0.95);
    color: #333;
    border-radius: 12px;
    padding: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #2c3e50;
    color: white;
    padding: 10px;
}

td {
    text-align: center;
    padding: 8px;
    border-bottom: 1px solid #ccc;
}

.banner{
    text-align:center;
    background:#ff9800;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="banner">
🔓 PUBLIC VIEW MODE - WINNERS DISPLAY (READ ONLY)
</div>

<h1>🏆 IT UNIWIDE EVENTS</h1>

<div class="admin-panel">

<h2>Event Winners (Locked View)</h2>
<div id="adminContent"></div>

<!-- LEADERBOARD -->
<div class="leaderboard-container">
<h2>Leaderboard</h2>
<table id="leaderboard">
<thead>
<tr>
<th>Rank</th>
<th>School</th>
<th>Total</th>
<th>🥇</th>
<th>🥈</th>
<th>🥉</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "it-f089d.firebaseapp.com",
    projectId: "it-f089d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const schools = [
"HEART","DIAMOND","SPADE","CLUB"
];

const events = [
"V-BALL MEN","V-BALL WOMEN",
"BASKETBALL MEN","BASKETBALL WOMEN",
"PHOTO CONTEST","CHARCOAL RENDERING",
"ON THE SPOT PAINTING ","TALUMPATI",
"PAGSUSULAT","ESSAY WRITING","EXTEMPORANEOUS SPEECH", 
"VOCAL SOLO", "VOCAL DUET","PENCIL DRAWING",
"BANNER MAKING","BEACH V-BALL MEN","BEACH V-BALL WOMAN",
"FUTSAL MEN", "FUTSAL WOMEN","PAGSUSULAT NG SANAYSAY","TALUMPATI",
"KUNDIMAN","SOFT BALL","BASE BALL","SEPAK TAKRAW","FOOTBALL","FUTSAL",
"BADMINTON MEN SINGLE","BADMINTON MEN DOUBLE","BADMINTON WOMEN SINGLE","BADMINTON WOMEN DOUBLE",
"100M RUN MEN","100M RUN WOMEN","200M RUN MEN", "200M RUN WOMEN", "400M RUN MEN","400M RUN WOMEN",
"800M RUN MEN", "800M RUN WOMEN","1500M RUN MEN","1500M RUN WOMEN","3000M RUN MEN","3000M RUN WOMEN",
"5000M RUN MEN", "5000M RUN WOMEN", "4X1 RELAY RUN MEN", "4X1 RELAY RUN WOMEN","4X4 RELAY RUN MEN",
"4X4 WOMEN RELAY RUN", "LONG JUMP MEN", "LONG JUMP WOMEN","HIGH JUMP MEN", "HIGH JUMP WOMEN",
"TRIPLE JUMP MEN", "TRIPLE JUMP WOMEN", "SHOT PUT MEN","SHOT PUT WOMEN", "JAVELIN THROW MEN",
"JAVELIN THROW WOMEN", "DISCUS THROW MEN","DISCUS THROW WOMEN","MOBILE LEGENDS MEN","MOBILE LEGENDS WOMEN",
"CODM MP MEN","CODM MP WOMEN","CODM BR MEN","CODM BR WOMEN","MR. CICS 2026","MS. CICS 2026"
];

let data = {};

/* CREATE READ ONLY EVENT VIEW */
function createEventView(){
    const panel = document.getElementById("adminContent");
    panel.innerHTML = "";

    events.forEach(event=>{
        const block = document.createElement("div");
        block.classList.add("event-block");

        block.innerHTML = `<strong>${event}</strong>`;

        const row = document.createElement("div");
        row.classList.add("ranking-row");

        for(let i=1;i<=9;i++){
            const cell = document.createElement("div");
            cell.classList.add("rank-cell");

            // 🔒 READ ONLY DISPLAY (NO SELECT)
            const assignedSchool = getSchoolByPosition(event, i);

            cell.innerHTML = `
                <b>${i}</b><br>
                ${assignedSchool || "-"}
            `;

            row.appendChild(cell);
        }

        block.appendChild(row);
        panel.appendChild(block);
    });
}

/* GET SCHOOL FOR POSITION */
function getSchoolByPosition(event,pos){
    for(let school of schools){
        if(data?.[school]?.events?.[event] == pos){
            return school;
        }
    }
    return null;
}

/* LEADERBOARD */
function updateLeaderboard(){
    const tbody = document.querySelector("#leaderboard tbody");
    const arr = Object.entries(data || {}).sort((a,b)=>b[1].total-a[1].total);

    tbody.innerHTML = "";
    let rank = 0;

    arr.forEach(item=>{
        const r = item[1].total > 0 ? ++rank : 0;

        tbody.innerHTML += `
        <tr>
            <td>${r}</td>
            <td>${item[0]}</td>
            <td>${item[1].total}</td>
            <td>${item[1].first}</td>
            <td>${item[1].second}</td>
            <td>${item[1].third}</td>
        </tr>`;
    });
}

/* REALTIME VIEW ONLY */
onSnapshot(doc(db,"leaderboard","main"),(docSnap)=>{
    if(docSnap.exists()){
        data = docSnap.data().data;
    }

    updateLeaderboard();
    createEventView();
});

</script>

</body>
</html>
