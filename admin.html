<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - IT UNIWIDE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg,#141E30,#243B55);
    color: #fff;
    margin: 0;
    padding: 30px;
}
h1 {
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 2.5em;
    margin-bottom: 20px;
    color: #FFD700;
}
.admin-panel {
    background: rgba(50,50,50,0.95);
    padding: 20px;
    border-radius: 12px;
    max-width: 1200px;
    margin: auto;
}
.event-block {
    margin-bottom: 25px;
    border-bottom: 1px solid #666;
    padding-bottom: 15px;
}
.ranking-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.rank-cell {
    width: 90px;
    font-size: 13px;
}
select {
    width: 100%;
    padding: 5px;
    border-radius: 5px;
}
button {
    padding: 10px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    cursor: pointer;
    width: 200px;
    color: white;
    font-weight: bold;
}
.reset-btn { background: #ff4b2b; }
.export-btn { background: #27ae60; }

.leaderboard-container {
    margin-top: 20px;
    background: rgba(255,255,255,0.95);
    color: #333;
    border-radius: 12px;
    padding: 15px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th {
    background: #2c3e50;
    color: white;
    padding: 10px;
}
td {
    text-align: center;
    padding: 8px;
    border-bottom: 1px solid #ccc;
}
.champion td { background: gold; font-weight: bold; }
.second-place td { background: silver; font-weight: bold; }
.third-place td { background: #cd7f32; font-weight: bold; }
</style>
</head>
<body>

<h1>🏆 IT UNIWIDE - Admin Panel</h1>

<div class="admin-panel">

<h2>Input Winners Per Event</h2>
<div id="adminContent"></div>

<div style="display:flex; gap:10px; flex-wrap:wrap;">
<button class="reset-btn" onclick="resetScores()">Reset Scores</button>
<button class="export-btn" onclick="exportReport()">Export Full Report</button>
</div>

<!-- LEADERBOARD TABLE -->
<div class="leaderboard-container">
<h2>Leaderboard</h2>
<table id="leaderboard">
<thead>
<tr>
<th>Rank</th>
<th>School</th>
<th>Total</th>
<th>🥇</th>
<th>🥈</th>
<th>🥉</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- EVENT TOP 3 TABLE -->
<div class="leaderboard-container">
<h2>Top 3 per Event</h2>
<table id="eventTop3">
<thead>
<tr>
<th>Event</th>
<th>🥇 1st</th>
<th>🥈 2nd</th>
<th>🥉 3rd</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC_s66HwsvpNKpLeZtxKC8vl1UTdmK21kg",
    authDomain: "it-f089d.firebaseapp.com",
    projectId: "it-f089d",
    storageBucket: "it-f089d.firebasestorage.app",
    messagingSenderId: "827972622",
    appId: "1:827972622:web:809c13c3c35c5142b2b05f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const schools = [
"CSU SOLANA","CSU CARIG","CSU LALLO","CSU SANCHEZ-MIRA",
"CSU LASAM","CSU PIAT","CSU APARRI","CSU GONZAGA","CSU ANDREWS"
];

const events = [
"Database Programming","Web Development (Static)",
"Web Development (Dynamic)","Digital Poster",
"Digital Slogan","Photo Journalism",
"Mobile Vlogging","Extemporaneous Speech",
"Research Presentation","Quiz Bee","UI/UX Design"
];

function getPoints(pos){
    return pos==1?10:
           pos==2?7:
           pos==3?5:
           pos==4?3:
           pos==5?2:
           pos==6?1:0;
}

// Initialize data and assigned
let data = {};
let assigned = {};
schools.forEach(s => {
    data[s] = { total:0, first:0, second:0, third:0, events:{} };
});

function createAdminPanel(){
    const panel=document.getElementById("adminContent");
    panel.innerHTML="";
    events.forEach(event=>{
        const block=document.createElement("div");
        block.classList.add("event-block");
        block.innerHTML=`<strong>${event}</strong>`;
        const row=document.createElement("div");
        row.classList.add("ranking-row");

        for(let i=1;i<=9;i++){
            const cell=document.createElement("div");
            cell.classList.add("rank-cell");
            cell.innerHTML=`
                ${i}:
                <select onchange="assignPoints('${event}',${i},this)">
                <option value="">Select</option>
                ${schools.map(s=>`<option value="${s}">${s}</option>`).join("")}
                </select>`;
            row.appendChild(cell);
        }

        block.appendChild(row);
        panel.appendChild(block);
    });
}

// Assign points when selecting winners
window.assignPoints = async function(event,pos,select){
    const school=select.value;
    if(!school) return;

    if(!data[school]) data[school]={total:0,first:0,second:0,third:0,events:{}};
    if(!assigned[event]) assigned[event]={};

    // Remove previous school in this position
    if(assigned[event][pos]){
        const prevSchool = assigned[event][pos];
        const prevPts = getPoints(pos);
        data[prevSchool].total -= prevPts;
        if(pos==1) data[prevSchool].first--;
        if(pos==2) data[prevSchool].second--;
        if(pos==3) data[prevSchool].third--;
        delete data[prevSchool].events[event];
    }

    // Prevent duplicate rankings
    for(let p in assigned[event]){
        if(assigned[event][p]===school){
            alert("School already ranked in this event");
            select.value="";
            return;
        }
    }

    assigned[event][pos]=school;

    const pts=getPoints(pos);
    data[school].total += pts;
    if(pos==1) data[school].first++;
    if(pos==2) data[school].second++;
    if(pos==3) data[school].third++;
    data[school].events[event]=pos;

    await saveToFirebase();
};

async function saveToFirebase(){
    await setDoc(doc(db,"leaderboard","main"),{
        data:data,
        assigned:assigned
    });
}

window.resetScores = async function(){
    if(confirm("Reset everything?")){
        schools.forEach(s=>{ data[s]={total:0,first:0,second:0,third:0,events:{}}; });
        assigned={};
        await saveToFirebase();
    }
};

// Update leaderboard table
function updateLeaderboard(){
    const tbody=document.querySelector("#leaderboard tbody");
    const arr=Object.entries(data).sort((a,b)=>b[1].total-a[1].total);

    tbody.innerHTML="";
    let rankCounter=0;
    arr.forEach(item=>{
        const rank=item[1].total>0?++rankCounter:0;
        let cls=rank==1?"champion":rank==2?"second-place":rank==3?"third-place":"";
        tbody.innerHTML+=`
        <tr class="${cls}">
        <td>${rank}</td>
        <td>${item[0]}</td>
        <td>${item[1].total}</td>
        <td>${item[1].first}</td>
        <td>${item[1].second}</td>
        <td>${item[1].third}</td>
        </tr>`;
    });
}

// Update Event Top 3 Table
function updateEventTop3(){
    const tableBody=document.querySelector("#eventTop3 tbody");
    tableBody.innerHTML="";

    events.forEach(event=>{
        let ranking=[];
        schools.forEach(school=>{
            const pos=data[school]?.events?.[event];
            if(pos) ranking.push([school,pos]);
        });
        ranking.sort((a,b)=>a[1]-b[1]);
        const top3=ranking.slice(0,3);

        const row=document.createElement("tr");
        const eventCell=document.createElement("td");
        eventCell.textContent=event;
        row.appendChild(eventCell);
        for(let i=0;i<3;i++){
            const cell=document.createElement("td");
            cell.textContent=top3[i]?top3[i][0]:"-";
            row.appendChild(cell);
        }
        tableBody.appendChild(row);
    });
}

// Listen for real-time updates
onSnapshot(doc(db,"leaderboard","main"),(docSnap)=>{
    if(docSnap.exists()){
        data=docSnap.data().data;
        assigned=docSnap.data().assigned;
    } else {
        schools.forEach(s=>{
            data[s]={total:0,first:0,second:0,third:0,events:{}};
        });
        assigned={};
        saveToFirebase();
    }
    updateLeaderboard();
    updateEventTop3();
});

createAdminPanel();
</script>

</body>
</html>
